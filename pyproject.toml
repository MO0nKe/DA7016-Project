[project]
name = "document-studio"
version = "0.1.0"
description = "AI Document Studio: structure-preserving PDF translation (DA7016 course project)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.149.0",
    "fonttools>=4.67.0",
    "httpx>=0.28.1",
    "nltk>=3.10.4",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "pymupdf>=2.0",
    "pymupdf-layout>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sacrebleu>=2.6.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["slow: launches Chrome (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["eval/conversion/docling", "eval/conversion/orig", "eval/conversion/ours"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors/warnings, import order, bugbear, pyupgrade, simplify
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E731",  # small lambdas bound to a name are used as local helpers
    "E741",  # `l` is the codebase's name for a PDF text line
    "B905",  # zip(strict=True) would raise where lengths may legitimately differ
    "SIM108",  # an if/else sometimes reads better than a ternary
]

[tool.ruff.lint.per-file-ignores]
# Long lines inside embedded JavaScript and CSS strings.
"backend/pipeline/export.py" = ["E501"]
"scripts/make_samples.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "mock_server"]
